<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Credit</title>

<!-- PWA / iOS install support -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0E1217" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Credit" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#0E1217; --panel:#161B22; --panel2:#1C222B;
    --border:#2A313C; --borderSoft:#232A33;
    --text:#E9E6DD; --textMuted:#8B93A1; --textDim:#5B6472;
    --amber:#C9A24B; --amberSoft:#3A2F1B;
    --green:#6E9C7C; --greenSoft:#1C2A21;
    --red:#C1594B; --redSoft:#2E1D1A;
    --blueGrey:#5C7A94;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    color:var(--text); font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Fraunces',serif;}
  #app{max-width:720px;margin:0 auto;padding:24px 16px 80px;}
  .header{margin-bottom:20px;}
  .header .title{font-family:'Fraunces',serif;font-size:26px;letter-spacing:-0.01em;}
  .header .subtitle{font-size:12px;color:var(--textDim);margin-top:2px;}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:20px;padding-bottom:4px;}
  .tab-btn{
    display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;
    background:transparent;color:var(--textMuted);border:1px solid var(--border);
    font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer;flex-shrink:0;
    font-family:'Inter',sans-serif;
  }
  .tab-btn.active{background:var(--amber);color:#1A1409;border-color:var(--amber);}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;}
  .stack{display:flex;flex-direction:column;gap:16px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media (max-width:480px){ .grid3{grid-template-columns:1fr 1fr;} .grid2{grid-template-columns:1fr;} }
  .label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--textDim);margin-bottom:6px;}
  input, select{
    width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:6px;
    padding:8px 10px;color:var(--text);font-size:13px;outline:none;font-family:'Inter',sans-serif;
  }
  input.num, input[type=number]{font-family:'IBM Plex Mono',monospace;}
  .field-prefix{position:relative;}
  .field-prefix span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--textDim);font-family:'IBM Plex Mono',monospace;font-size:13px;pointer-events:none;}
  .field-prefix input{padding-left:24px;}
  .btn{
    border-radius:6px;padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-family:'Inter',sans-serif;
  }
  .btn-primary{background:var(--amber);color:#1A1409;border-color:var(--amber);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--textDim);padding:4px;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--borderSoft);}
  .row:last-child{border-bottom:none;}
  .dim{color:var(--textDim);}
  .muted{color:var(--textMuted);}
  .flex-wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .empty{color:var(--textDim);font-size:13px;padding:10px 0;}
  a, a:visited{color:var(--amber);}
  ::placeholder{color:var(--textDim);}

  /* --- Auth --- */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth-box{width:100%;max-width:360px;}
  .auth-title{font-family:'Fraunces',serif;font-size:26px;margin-bottom:4px;}
  .auth-subtitle{font-size:12px;color:var(--textDim);margin-bottom:20px;}
  .auth-error{background:var(--redSoft);color:var(--red);border:1px solid var(--red);border-radius:6px;padding:8px 10px;font-size:12.5px;margin-top:12px;}
  .auth-info{background:var(--greenSoft);color:var(--green);border:1px solid var(--green);border-radius:6px;padding:8px 10px;font-size:12.5px;margin-top:12px;}
  .auth-switch{margin-top:16px;font-size:12.5px;color:var(--textMuted);text-align:center;}
  .auth-switch a{cursor:pointer;}
  .btn-block{width:100%;justify-content:center;margin-top:6px;}
  .logout-btn{position:absolute;top:24px;right:16px;}
  .header{position:relative;}
</style>
</head>
<body>
  <div id="app">Cargando…</div>
  <!-- SDK de Supabase (sin build, vía CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
